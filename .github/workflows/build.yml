name: Build Morphe
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          
      - name: Restore signing keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          test -n "$MORPHE_KEYSTORE_BASE64"
          printf '%s' "$MORPHE_KEYSTORE_BASE64" | base64 --decode > Morphe.keystore
          chmod 600 Morphe.keystore
          
      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          MAX_CODE=0

          # Сначала ищем последний использованный versionCode
          # в JSON-файлах ветки update.
          if git fetch origin update:refs/remotes/origin/update 2>/dev/null; then
            while IFS= read -r FILE; do
              [ -n "$FILE" ] || continue

              CODE=$(git show "refs/remotes/origin/update:$FILE" 2>/dev/null |
                jq -r '.versionCode // empty' |
                grep -E '^[0-9]+$' || true)

              if [ -n "$CODE" ] && [ "$CODE" -gt "$MAX_CODE" ]; then
                MAX_CODE="$CODE"
              fi
            done < <(
              git ls-tree -r --name-only refs/remotes/origin/update |
                grep -E '(^|/)[^/]*-update\.json$' || true
            )
          fi

          # Если JSON с versionCode ещё нет, используем
          # максимальный старый числовой тег, если он существует.
          if [ "$MAX_CODE" -eq 0 ]; then
            LEGACY_MAX=$(gh release list --limit 1000 --json tagName \
              -q '.[].tagName' |
              grep -E '^[0-9]+$' |
              sort -n |
              tail -n 1 || true)

            MAX_CODE="${LEGACY_MAX:-0}"
          fi

          NEXT_VER_CODE=$((MAX_CODE + 1))

          echo "NEXT_VER_CODE=$NEXT_VER_CODE" >> "$GITHUB_OUTPUT"
          echo "Previous versionCode: $MAX_CODE"
          echo "Next versionCode: $NEXT_VER_CODE"

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          
      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
          
      - name: Upload release
        id: upload_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          set -euo pipefail

          ls -lh ./build/*

          PATCH_VERSION=$(grep -m1 '^Patches:' build.md |
          grep -oE 'patches-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?\.mpp' |
          head -n1 |
          sed -E 's/^patches-//; s/\.mpp$//' || true)

          if [ -z "$PATCH_VERSION" ]; then
            echo "::error::Could not determine patch version from build.md"
            exit 1
          fi

          DATE=$(date -u +%F)
          TAG=""
          MAX_ATTEMPTS=100

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            if [ "$ATTEMPT" -eq 1 ]; then
              CANDIDATE="$DATE"
            else
              CANDIDATE="$DATE-$((ATTEMPT - 1))"
            fi

            if gh release view "$CANDIDATE" >/dev/null 2>&1; then
              echo "Release $CANDIDATE already exists; trying next tag."
              continue
            fi

            if gh release create "$CANDIDATE" \
              --target "$GITHUB_SHA" \
              --title "$PATCH_VERSION" \
              --notes "$BODY"; then
              TAG="$CANDIDATE"
              break
            fi

            if gh release view "$CANDIDATE" >/dev/null 2>&1; then
              echo "Tag $CANDIDATE was taken concurrently; trying next tag."
              continue
            fi

            echo "::error::Could not create release $CANDIDATE"
            exit 1
          done

          if [ -z "$TAG" ]; then
            echo "::error::Could not allocate a unique release tag"
            exit 1
          fi

          gh release upload "$TAG" ./build/* --clobber

          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "Created release $TAG ($PATCH_VERSION)"

      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.upload_release.outputs.TAG }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build.md *-update.json

          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi
